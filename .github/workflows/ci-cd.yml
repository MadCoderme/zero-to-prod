name: CinemaSeat CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ======================================================
  # 1. CONTINUOUS INTEGRATION (CI)
  # Runs on every Push and Pull Request to 'main'
  # ======================================================
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: |
          cd api
          bun install

      - name: Start Postgres & Gateway in CI Runner
        run: |
          docker compose up -d db gateway
          # Give DB time to run init.sql
          sleep 10

      - name: Run Tests
        run: |
          cd api
          HOLD_TTL_SECONDS=3 bun test

      - name: Verify Docker Containers Build
        run: |
          docker compose build

  # ======================================================
  # 2. CONTINUOUS DEPLOYMENT (CD)
  # Runs ONLY on Push to 'main' AFTER CI passes
  # ======================================================
  deploy:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Clone repository if it doesn't exist on EC2 yet
            if [ ! -d "zero-to-prod" ]; then
              git clone https://github.com/${{ github.repository }}.git zero-to-prod
            fi

            cd zero-to-prod
            
            # 2. Pull latest code from main
            git fetch origin main
            git reset --hard origin/main

            # 3. Rebuild and restart containers smoothly
            export HOLD_TTL_SECONDS=60
            docker compose up -d --build
            
            # 4. Prune unused docker images to save disk space on EC2
            docker image prune -f
name: CinemaSeat CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ======================================================
  # 1. CONTINUOUS INTEGRATION (CI)
  # ======================================================
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install API Dependencies
        run: |
          cd api
          bun install

      - name: Start Full Stack in CI Runner
        run: |
          # Build and start all services (Nginx, API, DB, Gateway) in GitHub cloud
          HOLD_TTL_SECONDS=3 docker compose up -d --build
          
          # Wait 15 seconds for DB to initialize and API to start
          sleep 15

      - name: Run Core Logic & Concurrency Tests
        run: |
          cd api
          # Hit Nginx (Port 80) or API directly (Port 8080)
          API_URL=http://localhost HOLD_TTL_SECONDS=3 bun test

  # ======================================================
  # 2. CONTINUOUS DEPLOYMENT (CD)
  # Runs ONLY on Push to 'main' AFTER CI passes
  # ======================================================
  deploy:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ ! -d "zero-to-prod" ]; then
              git clone https://github.com/${{ github.repository }}.git zero-to-prod
            fi

            cd zero-to-prod
            
            git fetch origin main
            git reset --hard origin/main

            export HOLD_TTL_SECONDS=60
            docker compose up -d --build
            
            docker image prune -f